name: enforce

# Kernel io_uring tracepoints under sudo. MUST fail (non-zero) if unavailable.
# Never a silent skip.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ftrace:
    name: Tracer C via io_uring tracepoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential liburing-dev strace
      - name: host capability (sudo — tracefs is root-only on runners)
        run: |
          set -euo pipefail
          uname -a
          if [[ ! -d /sys/kernel/tracing/events ]]; then
            sudo mount -t tracefs tracefs /sys/kernel/tracing || true
          fi
          if [[ ! -d /sys/kernel/debug/tracing/events ]] && [[ -d /sys/kernel/debug ]]; then
            sudo mount -t debugfs debugfs /sys/kernel/debug || true
          fi
          echo "tracefs listing:"
          sudo ls /sys/kernel/tracing/events/io_uring
      - name: enforce ftrace (sudo, loud failure)
        run: sudo ./scripts/enforce_ftrace.sh
