name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential liburing-dev strace
      - name: unit + tracer integration (no silent skips)
        run: ./scripts/run_tests.sh
      - name: short measurement (5 runs) must meet thresholds
        run: |
          set -euo pipefail
          python3 -m edr_blindness.measure --runs 5 --out results --tag ci-short
          python3 - <<'PY'
          import json, pathlib
          r = json.loads(pathlib.Path("results/measure-ci-short.json").read_text())
          assert r["pass_score_A"], r
          assert r["pass_score_C"], r
          # p-value with only 5 runs may still be <<0.01 if A is totally blind
          assert r["p_value_A_blindness"] < 0.01, r["p_value_A_blindness"]
          print("ci-short OK", r["mean_score_A"], r["mean_score_C"], r["p_value_A_blindness"])
          PY
